name: windows

# Builds the Windows DLLs with the same build.sh and pinned llvm-mingw image as a
# local build, then tests each one on a Windows runner of its own architecture.
# Run with: gh workflow run windows.yml --ref <branch>; fetch with ./fetch-windows.sh.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./build.sh win-x64 win-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native
          path: |
            artifacts/native/win-x64/
            artifacts/native/win-arm64/
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-2025 }
          - { rid: win-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-native
          path: artifacts/native
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: ./test.ps1 -Rid ${{ matrix.rid }}
        shell: pwsh
      # The exact DLL that passed, with its build info and test result.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tested-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}/
          if-no-files-found: error
      # Encoded outputs for scripts/djxl-check.sh.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-dump-${{ matrix.rid }}
          path: build/dump/
          if-no-files-found: error
          retention-days: 7
